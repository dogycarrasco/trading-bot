name: Trading Bot v35
on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: "pages"
  cancel-in-progress: false
jobs:
  run-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install deps
        run: |
          pip install --quiet -r trading_bot/requirements.txt
          pip install --quiet git+https://github.com/rongardF/tvdatafeed.git
          pip install --quiet yfinance
      - uses: actions/cache@v4
        with:
          path: |
            trading_bot/data/tv_cache/
            trading_bot/data/external/
          key: bot-data-${{ github.run_id }}
          restore-keys: bot-data-
      - name: Download data
        run: |
          cd trading_bot
          python -c "
          import os, pandas as pd, yfinance as yf
          universe = [('SPY','AMEX'),('QQQ','NASDAQ'),('XLK','AMEX'),('XLF','AMEX'),('XLE','AMEX'),('XLV','AMEX'),('XLY','AMEX'),('XLP','AMEX'),('XLI','AMEX'),('XLU','AMEX'),('GLD','AMEX'),('USO','AMEX'),('BTCUSD','BINANCE'),('ETHUSD','BINANCE'),('SOLUSD','BINANCE'),('BNBUSD','BINANCE'),('XRPUSD','BINANCE'),('ADAUSD','BINANCE'),('VIX','CBOE')]
          YF = {'SPY':'SPY','QQQ':'QQQ','XLK':'XLK','XLF':'XLF','XLE':'XLE','XLV':'XLV','XLY':'XLY','XLP':'XLP','XLI':'XLI','XLU':'XLU','GLD':'GLD','USO':'USO','BTCUSD':'BTC-USD','ETHUSD':'ETH-USD','SOLUSD':'SOL-USD','BNBUSD':'BNB-USD','XRPUSD':'XRP-USD','ADAUSD':'ADA-USD','VIX':'^VIX'}
          os.makedirs('data/tv_cache', exist_ok=True)
          for sym, exch in universe:
              yf_t = YF.get(sym, sym)
              path = f'data/tv_cache/{sym}_{exch}.csv'
              try:
                  df = yf.download(yf_t, period='2y', interval='1d', progress=False, auto_adjust=True)
                  if df is not None and not df.empty:
                      if isinstance(df.columns, pd.MultiIndex):
                          df.columns = df.columns.get_level_values(0)
                      df.columns = [c.lower() for c in df.columns]
                      df = df.dropna(subset=['close'])
                      if len(df) > 25:
                          df.to_csv(path)
              except: pass
          print('Datos OK')
          "
      - name: Run bot
        continue-on-error: true
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        run: |
          cd trading_bot
          python -m bot.main --once 2>&1 | tee ../live_run.log
      - name: Fallback state
        if: always()
        run: |
          mkdir -p trading_bot/results
          if [ ! -f trading_bot/results/live_state_v8.json ]; then
            echo '{"cash":500.0,"positions":{},"history":[]}' > trading_bot/results/live_state_v8.json
          fi
          cp live_run.log trading_bot/results/live_log_v8.txt 2>/dev/null || echo "Sin log" > trading_bot/results/live_log_v8.txt
      - name: Prepare site
        if: always()
        run: |
          mkdir -p _site
          cp trading_bot/docs/dashboard.html _site/index.html 2>/dev/null || echo "<html><body>Dashboard no encontrado</body></html>" > _site/index.html
          cp trading_bot/results/live_state_v8.json _site/live_state_v8.json 2>/dev/null || echo '{"cash":500,"positions":{}}' > _site/live_state_v8.json
          cp trading_bot/results/live_log_v8.txt _site/live_log_v8.txt 2>/dev/null || echo "Sin log" > _site/live_log_v8.txt
      - uses: actions/upload-pages-artifact@v3
        if: always()
        with:
          path: _site
      - name: Deploy Pages
        id: deployment
        if: always()
        uses: actions/deploy-pages@v3
      - name: Commit state
        if: always()
        run: |
          git config user.name "Trading Bot"
          git config user.email "bot@users.noreply.github.com"
          git add trading_bot/results/live_state_v8.json trading_bot/results/live_log_v8.txt
          git add trading_bot/results/trade_memory.json 2>/dev/null || true
          git commit -m "Estado bot: $(date -u '+%Y-%m-%d %H:%M')" || echo "nada"
          git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }} HEAD:main || echo "push fail"
