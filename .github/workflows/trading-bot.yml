name: Trading Bot v9

on:
  schedule:
    - cron: '0 2,6,12,18 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  run-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout codigo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Instalar dependencias
        run: |
          pip install --quiet -r trading_bot/requirements.txt
          pip install --quiet git+https://github.com/rongardF/tvdatafeed.git
          pip install --quiet yfinance

      - name: Restaurar cache de datos
        uses: actions/cache@v4
        with:
          path: |
            trading_bot/data/tv_cache/
            trading_bot/data/external/
          key: bot-data-${{ github.run_id }}
          restore-keys: |
            bot-data-

      - name: Descargar datos de TradingView
        run: |
          cd trading_bot
          python -c "
          from tvDatafeed import TvDatafeed, Interval
          import os
          tv = TvDatafeed()
          universe = [
              ('SPY','AMEX'),('QQQ','NASDAQ'),('XLK','AMEX'),('XLF','AMEX'),('XLE','AMEX'),
              ('XLV','AMEX'),('XLY','AMEX'),('XLP','AMEX'),('XLI','AMEX'),('XLU','AMEX'),
              ('GLD','AMEX'),('USO','AMEX'),
              ('BTCUSD','BINANCE'),('ETHUSD','BINANCE'),('SOLUSD','BINANCE'),
              ('BNBUSD','BINANCE'),('XRPUSD','BINANCE'),('ADAUSD','BINANCE'),
              ('VIX','CBOE')
          ]
          os.makedirs('data/tv_cache', exist_ok=True)
          for sym, exch in universe:
              path = f'data/tv_cache/{sym}_{exch}.csv'
              if True:
                  try:
                      df = tv.get_hist(symbol=sym, exchange=exch, interval=Interval.in_daily, n_bars=5000)
                      if df is not None and len(df) > 0:
                          df.to_csv(path)
                          print(f'{sym}: {len(df)} barras')
                  except Exception as e:
                      print(f'{sym}: ERROR {e}')
          print('Datos descargados.')
          "

      - name: Ejecutar ciclo del bot
        id: bot
        continue-on-error: true
        run: |
          cd trading_bot
          python -m bot.main --once 2>&1 | tee ../live_run.log

      - name: Asegurar que existe estado (fallback)
        run: |
          mkdir -p trading_bot/results
          if [ ! -f trading_bot/results/live_state_v8.json ]; then
            echo '{"cash":500.0,"positions":{},"history":[],"last_rebalance":null}' > trading_bot/results/live_state_v8.json
            echo "ESTADO FALLBACK CREADO" > trading_bot/results/live_log_v8.txt
          fi
          if [ ! -f trading_bot/results/live_log_v8.txt ]; then
            echo "Sin log disponible" > trading_bot/results/live_log_v8.txt
          fi
          cp live_run.log trading_bot/results/live_log_v8.txt 2>/dev/null || true

      - name: Generar tearsheet QuantStats
        continue-on-error: true
        run: |
          cd trading_bot
          python -c "
          import quantstats as qs
          import pandas as pd
          import json
          try:
              with open('results/live_state_v8.json') as f:
                  state = json.load(f)
              snapshots = state.get('daily_snapshots', [])
              if len(snapshots) > 5:
                  values = [s.get('total_value', 500) for s in snapshots]
                  dates = pd.to_datetime([s.get('date') for s in snapshots])
                  equity = pd.Series(values, index=dates)
                  returns = equity.pct_change().dropna()
                  qs.reports.html(returns, output='results/tearsheet.html', title='Bot v10 Live', download_images=True)
                  print('Tearsheet generado OK')
              else:
                  print('Sin suficientes snapshots para tearsheet aun')
          except Exception as e:
              print(f'Error tearsheet: {e}')
          "

      - name: Preparar sitio web
        run: |
          mkdir -p _site
          cp trading_bot/docs/dashboard.html _site/index.html
          cp trading_bot/results/live_state_v8.json _site/live_state_v8.json
          cp trading_bot/results/live_log_v8.txt _site/live_log_v8.txt
          cp trading_bot/results/tearsheet.html _site/tearsheet.html 2>/dev/null || echo "Sin tearsheet"

      - name: Subir artifact de Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy a GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Guardar estado del bot (commit)
        run: |
          git config user.name "Trading Bot"
          git config user.email "bot@users.noreply.github.com"
          git add trading_bot/results/live_state_v8.json
          git add trading_bot/results/live_log_v8.txt
          git add trading_bot/data/external/fundamentals_cache.json 2>/dev/null || true
          git commit -m "Estado bot: $(date -u '+%Y-%m-%d %H:%M')" || echo "Nada que commitear"
          git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }} HEAD:main || echo "Push fallido"
