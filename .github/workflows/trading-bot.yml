name: Trading Bot v32
on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: "pages"
  cancel-in-progress: false
jobs:
  run-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install deps
        run: |
          pip install --quiet -r trading_bot/requirements.txt
          pip install --quiet git+https://github.com/rongardF/tvdatafeed.git
          pip install --quiet yfinance alpaca-py
      - uses: actions/cache@v4
        with:
          path: |
            trading_bot/data/tv_cache/
            trading_bot/data/external/
          key: bot-data-${{ github.run_id }}
          restore-keys: bot-data-
      - name: Download data
        run: |
          cd trading_bot
          python -c "
          import os, pandas as pd, yfinance as yf
          universe = [('SPY','AMEX'),('QQQ','NASDAQ'),('XLK','AMEX'),('XLF','AMEX'),('XLE','AMEX'),('XLV','AMEX'),('XLY','AMEX'),('XLP','AMEX'),('XLI','AMEX'),('XLU','AMEX'),('GLD','AMEX'),('USO','AMEX'),('BTCUSD','BINANCE'),('ETHUSD','BINANCE'),('SOLUSD','BINANCE'),('BNBUSD','BINANCE'),('XRPUSD','BINANCE'),('ADAUSD','BINANCE'),('VIX','CBOE')]
          YF = {'SPY':'SPY','QQQ':'QQQ','XLK':'XLK','XLF':'XLF','XLE':'XLE','XLV':'XLV','XLY':'XLY','XLP':'XLP','XLI':'XLI','XLU':'XLU','GLD':'GLD','USO':'USO','BTCUSD':'BTC-USD','ETHUSD':'ETH-USD','SOLUSD':'SOL-USD','BNBUSD':'BNB-USD','XRPUSD':'XRP-USD','ADAUSD':'ADA-USD','VIX':'^VIX'}
          os.makedirs('data/tv_cache', exist_ok=True)
          try:
              from tvDatafeed import TvDatafeed, Interval
              tv = TvDatafeed()
              for sym, exch in universe:
                  try:
                      df = tv.get_hist(symbol=sym, exchange=exch, interval=Interval.in_daily, n_bars=5000)
                      if df is not None and len(df) > 0:
                          df.to_csv(f'data/tv_cache/{sym}_{exch}.csv')
                  except: pass
          except: pass
          for sym, exch in universe:
              yf_t = YF.get(sym, sym)
              path = f'data/tv_cache/{sym}_{exch}.csv'
              try:
                  df = yf.download(yf_t, period='2y', interval='1d', progress=False, auto_adjust=True)
                  if df is not None and not df.empty:
                      if isinstance(df.columns, pd.MultiIndex):
                          df.columns = df.columns.get_level_values(0)
                      df.columns = [c.lower() for c in df.columns]
                      df = df.dropna(subset=['close'])
                      if len(df) > 25:
                          df.to_csv(path)
                          print(f'{sym}: {len(df)} bars OK')
              except Exception as e:
                  print(f'{sym}: ERROR {e}')
          "
      - name: Run bot
        continue-on-error: true
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        run: |
          cd trading_bot
          python -m bot.main --once 2>&1 | tee ../live_run.log
      - name: Smoke test (guard)
        continue-on-error: true
        run: |
          if [ ! -s live_run.log ]; then echo "::error::log vacio"; exit 1; fi
          if grep -q "Traceback" live_run.log; then echo "::error::Traceback:"; grep -A6 Traceback live_run.log; exit 1; fi
          if ! grep -q "Ciclo completado" live_run.log; then echo "::error::ciclo no completo"; exit 1; fi
          if ! grep -qE "Oportunidades:|posiciones = max|Cash .* < min" live_run.log; then echo "::error::scan no corrio"; exit 1; fi
          EVALS=$(grep -cE "UTC\\]     [A-Z]+: (BUY|HOLD|SELL)" live_run.log || echo 0)
          if [ "$EVALS" -lt 5 ]; then echo "::error::solo $EVALS activos (<5)"; exit 1; fi
          echo "Smoke OK: $EVALS activos, ciclo completo"
          python -c "
          import json, sys
          s = json.load(open('trading_bot/results/live_state_v8.json'))
          t = s.get('total_value', 0)
          c = s.get('cash', 0)
          v = sum(p.get('value', 0) for p in s.get('positions', {}).values())
          if abs(t - (c + v)) > max(1.0, (c + v) * 0.01):
              print(f'::error::total_value {t:.2f} != cash+posiciones {c+v:.2f}'); sys.exit(1)
          print(f'JSON consistente: total={t:.2f}')
          "

      - name: Fallback state
        run: |
          mkdir -p trading_bot/results
          [ ! -f trading_bot/results/live_state_v8.json ] && echo '{"cash":500.0,"positions":{},"history":[],"last_rebalance":null}' > trading_bot/results/live_state_v8.json
          cp live_run.log trading_bot/results/live_log_v8.txt 2>/dev/null || true
      - name: Tearsheet
        continue-on-error: true
        run: |
          cd trading_bot
          python -c "
          import quantstats as qs, pandas as pd, json
          try:
              with open('results/live_state_v8.json') as f: s = json.load(f)
              snaps = s.get('daily_snapshots', [])
              if len(snaps) > 5:
                  v = [x.get('total_value',500) for x in snaps]
                  d = pd.to_datetime([x.get('date') for x in snaps])
                  qs.reports.html(pd.Series(v,index=d).pct_change().dropna(), output='results/tearsheet.html', title='Bot v32 Live')
          except: pass
          "
      - name: Prepare site
        if: always()
        run: |
          mkdir -p _site
          cp trading_bot/docs/dashboard.html _site/index.html 2>/dev/null || true
          cp trading_bot/results/live_state_v8.json _site/live_state_v8.json 2>/dev/null || echo "{"cash":500}" > _site/live_state_v8.json
          cp trading_bot/results/live_log_v8.txt _site/live_log_v8.txt 2>/dev/null || echo "Sin log" > _site/live_log_v8.txt
          cp trading_bot/results/tearsheet.html _site/tearsheet.html 2>/dev/null || true
      - uses: actions/upload-pages-artifact@v3
        if: always()
        with:
          path: _site
      - name: Deploy Pages
        id: deployment
        if: always()
        uses: actions/deploy-pages@v4
      - name: Commit state
        if: always()
        run: |
          git config user.name "Trading Bot"
          git config user.email "bot@users.noreply.github.com"
          git add trading_bot/results/live_state_v8.json trading_bot/results/live_log_v8.txt
          git add trading_bot/results/trade_memory.json 2>/dev/null || true
          git add trading_bot/data/external/fundamentals_cache.json 2>/dev/null || true
          git commit -m "Estado bot: $(date -u '+%Y-%m-%d %H:%M')" || echo "nada"
          git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }} HEAD:main || echo "push fail"
